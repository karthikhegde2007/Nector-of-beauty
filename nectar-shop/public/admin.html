<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Owner dashboard</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
body{padding-bottom:60px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;flex-wrap:wrap}
.top h1{font-size:1.7rem}.top a,.top button{margin-left:8px}
#main input,#main select,#main textarea{font:inherit;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;width:100%}
#main input[type=checkbox],#main input[type=radio]{width:auto;accent-color:var(--gold)}#main input[type=range]{padding:0;accent-color:var(--gold)}
#main label{display:grid;gap:4px;font-size:.92rem;color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}.stat{padding:16px}.stat b{display:block;font-size:1.7rem;font-family:'Cormorant Garamond',serif;color:var(--gold)}.stat span{color:var(--mute);font-size:.9rem}
.fm.cols{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.btn{cursor:pointer;font:inherit}
.pl .ln img{width:64px;height:64px}.tag{display:inline-block;padding:2px 10px;border-radius:20px;border:1px solid var(--line);font-size:.8rem;color:var(--mute);margin-right:6px}.tag.warn{color:#ffd48a;border-color:#ffd48a}
.login{max-width:380px;margin:12vh auto}
</style></head><body>
<div class="wrap"><div id="main"></div></div>
<div id="ts" popover="manual"></div>
<script src="/admin.js"></script></body></html>
